name: 💡 Feature Request
description: Suggest an idea or enhancement for Independent Books
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love community feature proposals! Please check existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is (e.g. "I'm always frustrated when...").
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've considered.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context / Tally Reference
      description: Add any relevant screenshots, Tally Prime shortcut references, or accounting workflow notes.
