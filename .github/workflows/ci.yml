name: CI & Accounting Integrity Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.9", "3.11", "3.12" ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Python Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Python Backend & Accounting Verification Suite
      run: |
        python -m pytest tests -q

    - name: Run Frontend Workflow & Calculation Tests
      run: |
        node tests/test_contextual_lookup.js
        node tests/test_date_picker.js
        node tests/test_phase1_logic.js
        node tests/test_print_view.js
        node tests/test_voucher_logic.js
